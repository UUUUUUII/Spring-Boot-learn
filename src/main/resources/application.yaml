spring:
  application:
    name: Spring-Boot-learn
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    #数据库连接池类型
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      #最大连接数，默认是10, cpu核心数量*2+1
      maximum-pool-size: 30
      #最小空闲连接，默认是10
      minimum-idle: 30
      #等待连接池分配连接的最大时长，超过该时长还没有可用连接则发生超时异常（单位毫秒）
      connection-timeout: 5000
      #空闲连接的最大时长，空闲多久就备释放回收，设置为0不让连接回收
      idle-timeout: 0
      #一个连接的最大生命时间，超过该时间还没有使用就回收掉（单位毫秒）
      max-lifetime: 18000000

logging:
  level:
    com.learn: debug

app:
  security:
    jwt:
      # 仅供本地开发使用的示例密钥；部署环境应通过 APP_SECURITY_JWT_SECRET 提供独立的 Base64 密钥。
      secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      # 默认令牌有效 15 分钟；生产环境可通过 APP_SECURITY_JWT_EXPIRATION_SECONDS 覆盖。
      expiration-seconds: 900

#mybatis-plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:/mapper/**/*.xml